<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#DCF1FB">
  <title>nav.</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body data-view="home">
  <div class="app">
    <div class="blob blob-1" aria-hidden="true"></div>
    <div class="blob blob-2" aria-hidden="true"></div>
    <div class="blob blob-3" aria-hidden="true"></div>

    <header class="topbar">
      <button class="logo-btn" data-action="tab" data-id="home" aria-label="nav. home">
        <img src="assets/logo.png" alt="nav." class="logo">
      </button>
      <button id="a11y" class="a11y-pill" role="switch" aria-checked="false" data-action="toggle-a11y">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="4.5" r="1.5"/><path d="M5 8l7 1.5l7 -1.5"/><path d="M12 9.5v4.5l-3 6"/><path d="M12 14l3 6"/></svg>
        <span>Accessibility</span>
        <span class="switch" aria-hidden="true"></span>
      </button>
    </header>

    <main id="view" class="view" tabindex="-1"></main>

    <div class="dock">
      <button class="search-pill" data-action="search">
        <svg class="ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6 -6"/></svg>
        <span>I need to…</span>
      </button>
      <nav class="tabbar" aria-label="Main"></nav>
    </div>

    <div id="notif" class="notif" aria-live="assertive"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
  </div>

  <script src="app.js"></script>
</body>
</html>
